# CUSTOM-FEATURE: [独立镜像构建与发布] START
# 分支策略:
#   canary - 仅同步上游，不触发本流水线
#   feat   - 唯一主线：推送 :feat / :latest / :version，并创建 GitHub Release
#   main   - 不使用
name: Dokploy Docker Build

on:
  push:
    branches: [feat]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/rain-kl/dokploy

permissions:
  contents: write
  packages: write

jobs:
  docker-amd:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=${IMAGE_NAME}:feat-amd64,${IMAGE_NAME}:latest-amd64,${IMAGE_NAME}:${VERSION}-amd64" >> $GITHUB_OUTPUT

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  docker-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=${IMAGE_NAME}:feat-arm64,${IMAGE_NAME}:latest-arm64,${IMAGE_NAME}:${VERSION}-arm64" >> $GITHUB_OUTPUT

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  combine-manifests:
    needs: [docker-amd, docker-arm]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          for TAG in feat latest "$VERSION"; do
            docker buildx imagetools create -t ${IMAGE_NAME}:${TAG} \
              ${IMAGE_NAME}:${TAG}-amd64 \
              ${IMAGE_NAME}:${TAG}-arm64
          done

  generate-release:
    needs: [combine-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare install.sh from local script
        run: |
          VERSION="${{ needs.combine-manifests.outputs.version }}"
          cp script/install.sh install.sh
          head -1 install.sh | grep -q '^#!' || { echo "install.sh is not a shell script"; exit 1; }
          grep -q 'DOKPLOY_VERSION\|detect_version' install.sh || { echo "install.sh does not support version detection"; exit 1; }
          {
            head -1 install.sh
            echo "DOKPLOY_VERSION=\"\${DOKPLOY_VERSION:-${VERSION}}\""
            tail -n +2 install.sh
          } > install-pinned.sh
          mv install-pinned.sh install.sh

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.combine-manifests.outputs.version }}
          name: ${{ needs.combine-manifests.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# CUSTOM-FEATURE: [独立镜像构建与发布] END
